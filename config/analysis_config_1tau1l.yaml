# FourTop Analysis Configuration - 1tau1l Channel
# Version: v10BDT1tau1l_WorkflowTest
# Created: 2025-12-02
#
# Full workflow test configuration for 1tau1l channel

metadata:
  version: "v10BDT1tau1l_WorkflowTest"
  created: "2025-12-02"
  channel: "1tau1l"
  description: "Full workflow test for 1tau1l channel with Stage 3-4 automation"

# Path components for building full paths
paths:
  base: "/publicfs/cms/user/huahuil/tauOfTTTT_NanoAOD/forMVA"
  out_version: "v1baselineHadroBtagWeightAdded"
  in_version: "v94HadroPreJetVetoHemOnly"
  hist_version: "v10BDT1tau1l_WorkflowTest"
  datacard_version: "v1WorkflowTest"

# Channel configuration
channel:
  name: "1tau1l"
  regions:
    - "1tau1lSR"
    - "1tau1lCR12"
  variables:
    - "BDT"

# Eras to process (Run 2)
eras:
  - "2018"
  - "2017"
  - "2016preVFP"
  - "2016postVFP"

# Analysis options
options:
  ifFakeTau: true
  ifMCFTau: false
  ifBlind: false
  ifVLL: false

# Stage 3 configuration (histogram production)
stage3:
  executable: "./apps/run_treeAnalyzer.out"
  ifSys: 1
  justMC: false
  processes:
    - "tttt"
    - "ttbar_0l"
    - "ttbar_1l"
    - "ttbar_2l"
    - "TTZToLLNuNu"
    - "TTZToQQ"
    - "TTWJetsToQQ"
    - "TTWJetsToLNu"
    - "ttH_bb"
    - "ttH_nonbb"
    - "st_tW_antitop"
    - "st_tW_top"
    - "st_schan_had"
    - "st_schan_lep"
    - "st_tchan"
    - "WJetsToLNu_HT-200To400"
    - "WJetsToLNu_HT-400To600"
    - "WJetsToLNu_HT-600To800"
    - "WJetsToLNu_HT-800To1200"
    - "WJetsToLNu_HT-1200To2500"
    - "WJetsToLNu_HT-2500ToInf"

# Smoothing configuration (Stage 4.2.5)
smoothing:
  enabled: true
  systematics:
    - "ps_fsr"
    - "CMS_btag_fullShape_hf"
    - "ps_isr"
    - "CMS_scale_j_FlavorPureGluon"
    - "pdf_alphas"
    - "QCDscale_fac"
    - "QCDscale_ren"
    - "CMS_res_j"
    - "CMS_scale_j_FlavorPureQuark"
  processes:
    - "tt"
    - "ttH"
    - "ttZ"
    - "ttW"

# Combine configuration (Stage 4.4)
combine:
  combination_version: "combinationV22"
  steps:
    - "workspace"
    - "limits"
    - "significance"
    - "impacts"
    - "postfit"
    - "signal_strength"

# Logging configuration
logging:
  log_dir: "logs"
  log_level: "INFO"
  timestamp_format: "%Y-%m-%d %H:%M:%S"
